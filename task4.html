<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🌤️ Weather App</h1>

        <div class="search-box">
            <input type="text" id="cityInput" placeholder="Enter city name...">
            <button onclick="getWeatherByCity()">Search</button>
        </div>

        <button class="location-btn" onclick="getWeatherByLocation()">
            📍 Use My Location
        </button>

        <div id="loading"></div>
        <div id="error"></div>

        <div class="weather-card" id="weatherCard">

            <h2 id="cityName">City</h2>

            <div class="weather-icon">
                <img id="weatherIcon" src="" alt="Weather Icon">
            </div>

            <h3 id="temperature">--°C</h3>

            <p id="condition">Weather Condition</p>

            <div class="weather-details">

                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div>
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="windSpeed">-- km/h</strong>
                </div>

                <div>
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

                <div>
                    <span>📊</span>
                    <p>Pressure</p>
                    <strong id="pressure">-- hPa</strong>
                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
